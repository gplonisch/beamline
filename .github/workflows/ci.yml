name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Engine, level and solver tests
        run: node --test tests/*.test.mjs

      # Proof rather than assertion: the solver is exhaustive, so this passing
      # means every level can be finished, and in no fewer pieces than its budget.
      - name: Exhaustive solvability and exact budgets
        run: node scripts/solve.mjs

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Guards a quiet failure: an asset added to index.html but not to
      # build_zip.sh ships to a games portal as a missing file. The normal
      # tests run against the repository, not against the packaged zip.
      - name: Package for itch.io and verify it is self-contained
        run: |
          ./itch/build_zip.sh
          python3 itch/verify_zip.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Reads canvas pixels to check light lands where the engine says it does.
      - name: Browser tests
        run: npx playwright test

  deploy:
    needs: [engine, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Keep only the files the game serves
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js fonts LICENSE _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
